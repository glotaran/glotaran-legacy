# Builds the portable ZIP for a v1.5.x tag and attaches it, with its SHA-256,
# to a draft GitHub Release. Review the notes and publish the draft by hand.

name: Release

on:
  push:
    tags: ["v1.5.*"]

permissions:
  contents: write

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.httpconnectionManager.ttlSeconds=120

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 8
        uses: actions/setup-java@v6
        with:
          java-version: "8"
          distribution: temurin
          cache: maven
      - name: Build with Maven
        run: mvn -B -T 1C clean verify -Pdeployment --file pom.xml --no-transfer-progress
      - name: Checksum portable ZIP
        run: |
          version="${GITHUB_REF_NAME#v}"
          zip="glotaran-app-${version}.zip"
          test -s "application/target/${zip}" || { echo "::error::${zip} not found; does the POM version match the tag?"; exit 1; }
          cd application/target
          sha256sum "${zip}" > "${zip}.sha256"
          cat "${zip}.sha256"
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          gh release create "${GITHUB_REF_NAME}" \
            --draft \
            --verify-tag \
            --title "Glotaran ${version}" \
            --notes-file docs/release-notes/${version}.md \
            "application/target/glotaran-app-${version}.zip" \
            "application/target/glotaran-app-${version}.zip.sha256"

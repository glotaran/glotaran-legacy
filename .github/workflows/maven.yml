# This workflow will build a Java project with Maven, and cache/restore any dependencies to improve the workflow execution time
# For more information see: https://help.github.com/actions/language-and-framework-guides/building-and-testing-java-with-maven

name: Java CI with Maven

on:
  push:
    branches: [main, maintenance/v1.5.x, maintenance/v1.6.x, maintenance/v1.7.x]
  pull_request:
    branches: [main, maintenance/v1.5.x, maintenance/v1.6.x, maintenance/v1.7.x]

env:
  MAVEN_OPTS: -Dhttp.keepAlive=false -Dmaven.wagon.http.pool=false -Dmaven.wagon.http.retryHandler.class=standard -Dmaven.wagon.http.retryHandler.count=3 -Dmaven.wagon.httpconnectionManager.ttlSeconds=120

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      # ApplicationTest starts the platform with all clusters (NbModuleSuite) and fails on warnings
      - name: Build with Maven and run the application smoke test
        shell: bash
        run: >
          ${{ runner.os == 'Linux' && 'xvfb-run -a' || '' }}
          mvn -B -T 1C clean verify -Pdeployment --file pom.xml --no-transfer-progress
          -DskipTests=false -Dtest=ApplicationTest -DfailIfNoTests=false
      - name: Upload portable ZIP
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: glotaran-portable-zip
          path: application/target/glotaran-app-*.zip
          if-no-files-found: error

  # Installs the locked R runtime of each platform with micromamba, starts Rserve and connects with the Java client
  # (ManagedRuntimeIT). Add a TIMP fit once r-timp is on conda-forge and in the lock.
  r-runtime:
    name: Managed R runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-26-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          java-version: "25"
          distribution: temurin
          cache: maven
      - name: Install the R runtime and connect to Rserve
        shell: bash
        run: >
          mvn -B -pl TIMPController -am verify --file pom.xml --no-transfer-progress
          -DskipTests=false -Dtest=ManagedRuntimeIT -DfailIfNoTests=false
# extra argument taken from:
# https://github.com/actions/virtual-environments/issues/1499#issuecomment-689467080
